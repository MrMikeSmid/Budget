name: Deploy via FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Upload app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: FTP-client installeren
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: App uploaden
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: ./scripts/deploy-ftp.sh
