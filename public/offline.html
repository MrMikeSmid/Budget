<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6d4aff">
    <title>Je bent offline · Samen</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f0f5;color:#201b2c;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:40px 30px;text-align:center;border-radius:28px;background:#faf8f5;box-shadow:0 18px 60px rgba(41,30,72,.12)}.mark{position:relative;width:72px;height:60px;margin:0 auto 28px}.mark i{position:absolute;width:38px;height:38px;border-radius:50%}.mark i:first-child{left:0;top:18px;background:#ff8f79}.mark i:nth-child(2){left:18px;top:0;background:#6d4aff}.mark i:last-child{left:36px;top:20px;background:#f5c755}h1{margin:0 0 12px;font-size:30px}p{margin:0 0 24px;color:#777184;line-height:1.6}button{border:0;border-radius:16px;padding:15px 20px;background:#6d4aff;color:#fff;font:700 16px inherit;cursor:pointer}
    </style>
</head>
<body><main class="card"><div class="mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>Even geen verbinding</h1><p>Zodra je weer online bent, staan jullie gedeelde lijstjes direct voor je klaar.</p><button type="button" onclick="location.reload()">Opnieuw proberen</button></main></body>
</html>
